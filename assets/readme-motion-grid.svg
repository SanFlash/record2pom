<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">Record2POM animated capability grid</title><desc id="desc">Six glass panels representing recording, locator intelligence, test generation, safety, automation, and reports.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080b18"/><stop offset="1" stop-color="#17183b"/></linearGradient>
 <linearGradient id="edge" x2="1" y2="1"><stop stop-color="#6cf5e6" stop-opacity=".8"/><stop offset="1" stop-color="#a28bff" stop-opacity=".5"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="460" rx="26" fill="url(#bg)"/>
<g fill="none" stroke="#8ca6ff" stroke-opacity=".12"><path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200M0 350H1200M0 420H1200"/><path d="M70 0V460M140 0V460M210 0V460M280 0V460M350 0V460M420 0V460M490 0V460M560 0V460M630 0V460M700 0V460M770 0V460M840 0V460M910 0V460M980 0V460M1050 0V460M1120 0V460"/></g>
<text x="52" y="54" fill="#6cf5e6" font-family="monospace" font-size="13" letter-spacing="4">THE AUTOMATION TOOLKIT / SIX CORE MODULES</text>
<g font-family="Arial,sans-serif">
 <g transform="translate(42 88)"><rect width="350" height="145" rx="18" fill="#111a32" stroke="url(#edge)"/><circle cx="50" cy="49" r="23" fill="#6cf5e6" fill-opacity=".1" stroke="#6cf5e6"/><circle cx="50" cy="49" r="8" fill="#6cf5e6"><animate attributeName="r" values="7;11;7" dur="2s" repeatCount="indefinite"/></circle><text x="88" y="46" fill="#f4f6ff" font-size="20" font-weight="700">Browser capture</text><text x="24" y="91" fill="#a4accb" font-size="13">Record clicks, inputs, and navigation</text><path d="M24 117H318" stroke="#ffffff" stroke-opacity=".12"/><path d="M24 117H220" stroke="#6cf5e6" stroke-width="3"><animate attributeName="d" values="M24 117H90;M24 117H290;M24 117H90" dur="4s" repeatCount="indefinite"/></path></g>
 <g transform="translate(425 88)"><rect width="350" height="145" rx="18" fill="#111a32" stroke="url(#edge)"/><circle cx="50" cy="49" r="23" fill="#a28bff" fill-opacity=".1" stroke="#a28bff"/><path d="M38 49h24M50 37v24" stroke="#a28bff" stroke-width="3"><animateTransform attributeName="transform" type="rotate" from="0 50 49" to="360 50 49" dur="12s" repeatCount="indefinite"/></path><text x="88" y="46" fill="#f4f6ff" font-size="20" font-weight="700">Locator intelligence</text><text x="24" y="91" fill="#a4accb" font-size="13">Rank semantic and resilient selectors</text><path d="M24 117H318" stroke="#ffffff" stroke-opacity=".12"/><circle cx="280" cy="117" r="4" fill="#a28bff"><animate attributeName="cx" values="24;318;24" dur="4s" repeatCount="indefinite"/></circle></g>
 <g transform="translate(808 88)"><rect width="350" height="145" rx="18" fill="#111a32" stroke="url(#edge)"/><circle cx="50" cy="49" r="23" fill="#6cf5e6" fill-opacity=".1" stroke="#6cf5e6"/><path d="M39 38h22v22H39zM44 44h12M44 50h12M44 56h8" stroke="#6cf5e6" fill="none" stroke-width="2"/><text x="88" y="46" fill="#f4f6ff" font-size="20" font-weight="700">POM generation</text><text x="24" y="91" fill="#a4accb" font-size="13">Export Python test projects</text><path d="M24 117H318" stroke="#ffffff" stroke-opacity=".12"/><rect x="24" y="113" width="0" height="8" rx="4" fill="#6cf5e6"><animate attributeName="width" values="0;294;0" dur="5s" repeatCount="indefinite"/></rect></g>
 <g transform="translate(42 260)"><rect width="350" height="145" rx="18" fill="#111a32" stroke="url(#edge)"/><circle cx="50" cy="49" r="23" fill="#a28bff" fill-opacity=".1" stroke="#a28bff"/><path d="M50 32l16 7v12c0 11-16 18-16 18S34 62 34 51V39z" fill="none" stroke="#a28bff" stroke-width="2"/><text x="88" y="46" fill="#f4f6ff" font-size="20" font-weight="700">Safety checks</text><text x="24" y="91" fill="#a4accb" font-size="13">Redaction and readiness review</text><circle cx="318" cy="25" r="4" fill="#6cf5e6" filter="url(#glow)"><animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite"/></circle></g>
 <g transform="translate(425 260)"><rect width="350" height="145" rx="18" fill="#111a32" stroke="url(#edge)"/><circle cx="50" cy="49" r="23" fill="#6cf5e6" fill-opacity=".1" stroke="#6cf5e6"/><path d="M39 50l8 8 15-18" fill="none" stroke="#6cf5e6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="88" y="46" fill="#f4f6ff" font-size="20" font-weight="700">Test execution</text><text x="24" y="91" fill="#a4accb" font-size="13">Run generated tests locally</text><g fill="#6cf5e6"><rect x="24" y="110" width="34" height="8" rx="4"><animate attributeName="opacity" values="1;.25;1" dur="1.5s" repeatCount="indefinite"/></rect><rect x="64" y="110" width="34" height="8" rx="4"><animate attributeName="opacity" values=".25;1;.25" dur="1.5s" repeatCount="indefinite"/></rect><rect x="104" y="110" width="34" height="8" rx="4"><animate attributeName="opacity" values="1;.25;1" dur="1.5s" repeatCount="indefinite"/></rect></g></g>
 <g transform="translate(808 260)"><rect width="350" height="145" rx="18" fill="#111a32" stroke="url(#edge)"/><circle cx="50" cy="49" r="23" fill="#a28bff" fill-opacity=".1" stroke="#a28bff"/><path d="M36 60V48h8v12M47 60V37h8v23M58 60V43h8v17" fill="none" stroke="#a28bff" stroke-width="2"/><text x="88" y="46" fill="#f4f6ff" font-size="20" font-weight="700">Reports &amp; artifacts</text><text x="24" y="91" fill="#a4accb" font-size="13">Inspect logs, JSON, and JUnit output</text><path d="M24 119l40-12 32 5 40-22 32 6 40-30 32 8 45-18" fill="none" stroke="#6cf5e6" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 6"><animate attributeName="stroke-dashoffset" values="0;-28" dur="3s" repeatCount="indefinite"/></path></g>
</g></svg>