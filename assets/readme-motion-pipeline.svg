<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-labelledby="title">
<title id="title">Animated Record2POM workflow pipeline</title>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080b18"/><stop offset="1" stop-color="#17183b"/></linearGradient><linearGradient id="line"><stop stop-color="#6cf5e6"/><stop offset="1" stop-color="#a28bff"/></linearGradient></defs>
<rect width="1200" height="210" rx="24" fill="url(#bg)"/>
<g stroke="#7e96ff" stroke-opacity=".1"><path d="M0 52H1200M0 105H1200M0 158H1200"/></g>
<path d="M115 95H1085" stroke="#354060" stroke-width="4" stroke-linecap="round"/><path d="M115 95H1085" stroke="url(#line)" stroke-width="2" stroke-dasharray="12 18"><animate attributeName="stroke-dashoffset" values="0;-60" dur="3s" repeatCount="indefinite"/></path>
<g font-family="Arial,sans-serif" text-anchor="middle">
<g transform="translate(115 95)"><circle r="34" fill="#101a31" stroke="#6cf5e6" stroke-width="2"/><circle r="22" fill="none" stroke="#6cf5e6" stroke-opacity=".4"/><circle r="8" fill="#6cf5e6"><animate attributeName="r" values="6;11;6" dur="2s" repeatCount="indefinite"/></circle><text y="58" fill="#f4f6ff" font-size="14" font-weight="700">RECORD</text><text y="76" fill="#a4accb" font-size="10">Capture journey</text></g>
<g transform="translate(357 95)"><circle r="34" fill="#101a31" stroke="#a28bff" stroke-width="2"/><path d="M-13 -9h26v18h-26zM-7 -3h14M-7 3h14" fill="none" stroke="#a28bff" stroke-width="2"/><text y="58" fill="#f4f6ff" font-size="14" font-weight="700">NORMALIZE</text><text y="76" fill="#a4accb" font-size="10">Validate structure</text></g>
<g transform="translate(600 95)"><circle r="34" fill="#101a31" stroke="#6cf5e6" stroke-width="2"/><path d="M-15 0l10 10 20-23" fill="none" stroke="#6cf5e6" stroke-width="3" stroke-linecap="round"/><text y="58" fill="#f4f6ff" font-size="14" font-weight="700">REVIEW</text><text y="76" fill="#a4accb" font-size="10">Inspect locators</text></g>
<g transform="translate(843 95)"><circle r="34" fill="#101a31" stroke="#a28bff" stroke-width="2"/><path d="M-13 -12h17l9 9v18h-26zM4 -12v9h9M-7 2h14M-7 8h14" fill="none" stroke="#a28bff" stroke-width="2"/><text y="58" fill="#f4f6ff" font-size="14" font-weight="700">GENERATE</text><text y="76" fill="#a4accb" font-size="10">Export Python POM</text></g>
<g transform="translate(1085 95)"><circle r="34" fill="#101a31" stroke="#6cf5e6" stroke-width="2"/><path d="M-14 0l9 9 19-20" fill="none" stroke="#6cf5e6" stroke-width="3" stroke-linecap="round"/><text y="58" fill="#f4f6ff" font-size="14" font-weight="700">RUN</text><text y="76" fill="#a4accb" font-size="10">Execute locally</text></g>
</g></svg>