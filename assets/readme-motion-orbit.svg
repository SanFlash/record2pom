<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title">
<title id="title">Record2POM technology ecosystem with animated orbit</title>
<defs><radialGradient id="bg"><stop stop-color="#18264a"/><stop offset="1" stop-color="#080b18"/></radialGradient><linearGradient id="orbit"><stop stop-color="#6cf5e6"/><stop offset="1" stop-color="#a28bff"/></linearGradient></defs>
<rect width="1200" height="300" rx="24" fill="url(#bg)"/>
<g fill="none" stroke="#9bb4ff" stroke-opacity=".18"><ellipse cx="600" cy="144" rx="360" ry="90"/><ellipse cx="600" cy="144" rx="260" ry="62" transform="rotate(24 600 144)"/><ellipse cx="600" cy="144" rx="260" ry="62" transform="rotate(-24 600 144)"/></g>
<g font-family="Arial,sans-serif" text-anchor="middle"><circle cx="600" cy="144" r="57" fill="#6cf5e6" fill-opacity=".08" stroke="#6cf5e6" stroke-width="2"/><circle cx="600" cy="144" r="42" fill="none" stroke="#6cf5e6" stroke-opacity=".45"><animate attributeName="r" values="38;46;38" dur="3s" repeatCount="indefinite"/></circle><text x="600" y="140" fill="#f4f6ff" font-size="20" font-weight="700">Record2POM</text><text x="600" y="160" fill="#6cf5e6" font-size="10" letter-spacing="2">AUTOMATION CORE</text>
<g><circle cx="345" cy="103" r="28" fill="#111a32" stroke="#6cf5e6"/><text x="345" y="108" fill="#f4f6ff" font-size="12">GSAP</text><circle cx="850" cy="104" r="28" fill="#111a32" stroke="#a28bff"/><text x="850" y="108" fill="#f4f6ff" font-size="12">POM</text><circle cx="420" cy="214" r="28" fill="#111a32" stroke="#a28bff"/><text x="420" y="218" fill="#f4f6ff" font-size="12">Python</text><circle cx="790" cy="214" r="28" fill="#111a32" stroke="#6cf5e6"/><text x="790" y="218" fill="#f4f6ff" font-size="12">CI / E2E</text><circle cx="600" cy="39" r="22" fill="#111a32" stroke="#6cf5e6"/><text x="600" y="43" fill="#f4f6ff" font-size="10">MV3</text></g>
<circle r="6" fill="#6cf5e6"><animateMotion dur="8s" repeatCount="indefinite" path="M345 103 Q600 5 850 104 Q950 190 790 214 Q600 290 420 214 Q250 180 345 103"/></circle><circle r="4" fill="#a28bff"><animateMotion dur="6s" repeatCount="indefinite" path="M850 104 Q600 290 420 214 Q250 180 345 103 Q600 5 850 104"/></circle>
</g></svg>