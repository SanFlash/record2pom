name: Record2POM checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm test
      - run: python -m pip install "pytest-playwright>=0.5,<1"
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/e2e
      - name: Validate branded Chrome extension
        run: |
          python - <<'PY'
          import json, re, struct
          from pathlib import Path
          root = Path("extension")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          assert manifest["manifest_version"] == 3, "Extension must use Manifest V3"
          assert re.fullmatch(r"(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-[0-9A-Za-z.-]+)?", manifest["version"]), "Invalid extension release version"
          assert "Record2POM" in manifest["name"]
          required = [manifest["background"]["service_worker"], manifest["action"]["default_popup"], *manifest["icons"].values(), *manifest["action"]["default_icon"].values(), *[p for item in manifest["content_scripts"] for p in item["js"]], "popup.css"]
          for relative in required:
              path = root / relative
              if not path.is_file():
                  raise SystemExit(f"Missing extension asset: {relative}")
          icon = root / "icons/icon128.png"
          with icon.open("rb") as f:
              header = f.read(24)
          if header[:8] != b"\x89PNG\r\n\x1a\n":
              raise SystemExit("Extension icon is not a valid PNG")
          width, height = struct.unpack(">II", header[16:24])
          if (width, height) != (128, 128):
              raise SystemExit(f"Expected 128x128 extension icon, got {width}x{height}")
          html = (root / "popup.html").read_text(encoding="utf-8")
          css = (root / "popup.css").read_text(encoding="utf-8")
          if "Record2POM" not in html or "wordmark-accent" not in html or "linear-gradient" not in css:
              raise SystemExit("Neon Record2POM popup branding is missing")
          print(f"Validated Record2POM extension v{manifest['version']} and branded popup/icon.")
          PY
      - name: Build and verify versioned Chrome extension
        run: npm run package:extension
      - uses: actions/upload-artifact@v4
        name: Upload versioned Chrome extension and SHA-256 checksum
        with:
          name: record2pom-chrome-extension
          path: |
            dist/record2pom-extension-v*.zip
            dist/record2pom-extension-v*.zip.sha256
          if-no-files-found: error
          retention-days: 30
