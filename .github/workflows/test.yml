name: Record2POM checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm test
      - run: python -m pip install "pytest-playwright>=0.5,<1"
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/e2e
